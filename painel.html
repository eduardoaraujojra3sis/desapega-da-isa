<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#2B1D14">
<meta name="robots" content="noindex">
<title>Painel · Desapega da Isa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Mulish:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="painel.css">
</head>
<body>
<div id="app"></div>

<script type="text/x-dc-template" id="dc-template">
<div>
  <sc-if value="{{ loading }}">
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:26px;animation:isaPulse 1.4s ease-in-out infinite;">★</div>
  </sc-if>

  <!-- ===================== LOGIN ===================== -->
  <sc-if value="{{ needLogin }}">
    <div class="login" style="animation:isaFade .4s ease both;">
      <div class="login-art">
        <span class="eyebrow" style="color:var(--sand);">★ Área da Isa ★</span>
        <b>{{ storeName }}</b>
        <p>Suas peças, suas vendas e quem está de olho no seu closet — tudo num lugar só.</p>
      </div>
      <div class="login-form">
        <form onSubmit="{{ login }}">
          <div style="display:flex;flex-direction:column;gap:6px;">
            <span class="eyebrow">Bem-vinda de volta</span>
            <h1>Entrar no painel</h1>
          </div>
          <sc-if value="{{ isRemote }}">
            <div class="field">
              <label>E-mail</label>
              <input class="input" type="email" autocomplete="username" value="{{ email }}" onChange="{{ onEmail }}" placeholder="isa@email.com">
            </div>
          </sc-if>
          <div class="field">
            <label>Senha</label>
            <input class="input" type="password" autocomplete="current-password" value="{{ pw }}" onChange="{{ onPw }}" placeholder="••••••">
          </div>
          <sc-if value="{{ pwErr }}"><div class="err">{{ pwErr }}</div></sc-if>
          <button type="submit" class="btn btn-primary" style="min-height:48px;font-size:14px;">{{ loginLabel }}</button>
          <sc-if value="{{ isLocal }}"><span style="font-size:12px;color:var(--muted);">Modo demonstração · senha inicial: isa123.</span></sc-if>
          <a href="./" style="font-size:13px;font-weight:600;">← Voltar para a loja</a>
        </form>
      </div>
    </div>
  </sc-if>

  <!-- ===================== PAINEL ===================== -->
  <sc-if value="{{ authed }}">
    <div class="shell">
      <aside class="side">
        <div class="side-brand"><b>{{ storeName }}</b><span>Painel</span></div>
        <nav class="side-nav">
          <sc-for list="{{ nav }}" as="n">
            <button onClick="{{ n.pick }}" class="nav-item {{ n.cls }}"><span style="display:inline-flex;" innerHTML="{{ n.icon }}"></span>{{ n.label }}</button>
          </sc-for>
        </nav>
        <div class="side-foot">
          <a href="./" target="_blank" class="nav-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"></path><path d="M10 14 21 3"></path><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path></svg>Ver a loja</a>
          <button onClick="{{ logout }}" class="nav-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="m16 17 5-5-5-5"></path><path d="M21 12H9"></path></svg>Sair</button>
        </div>
      </aside>

      <div style="min-width:0;">
        <header class="topbar">
          <div class="topbar-row">
            <b>{{ storeName }}</b>
            <div style="display:flex;gap:6px;">
              <a href="./" target="_blank" class="btn">Loja ↗</a>
              <button onClick="{{ logout }}" class="btn">Sair</button>
            </div>
          </div>
          <nav class="topbar-nav">
            <sc-for list="{{ nav }}" as="n">
              <button onClick="{{ n.pick }}" class="nav-item {{ n.cls }}">{{ n.label }}</button>
            </sc-for>
          </nav>
        </header>

        <main class="main">
          <div class="wrap">

          <!-- ============ VISÃO GERAL ============ -->
          <sc-if value="{{ tabDash }}">
            <div class="page-head">
              <div>
                <span class="eyebrow">{{ greeting }}</span>
                <h1>Como está o closet</h1>
                <p>Vendas, visitas e as peças que mais chamam atenção.</p>
              </div>
              <div class="seg">
                <sc-for list="{{ periods }}" as="p"><button onClick="{{ p.pick }}" class="{{ p.cls }}">{{ p.label }}</button></sc-for>
              </div>
            </div>

            <sc-if value="{{ statsNotice }}">
              <div class="notice">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4"></path><path d="M12 16h.01"></path></svg>
                <span>{{ statsNotice }}</span>
              </div>
            </sc-if>

            <div class="kpis">
              <sc-for list="{{ kpis }}" as="k">
                <div class="card kpi {{ k.cls }}">
                  <span class="k-label"><span class="k-icon" innerHTML="{{ k.icon }}"></span>{{ k.label }}</span>
                  <span class="k-value">{{ k.value }}</span>
                  <span class="k-sub">{{ k.sub }}</span>
                </div>
              </sc-for>
            </div>

            <div class="mini">
              <sc-for list="{{ minis }}" as="k">
                <div class="card"><span class="m-label">{{ k.label }}</span><span class="m-value">{{ k.value }}</span></div>
              </sc-for>
            </div>

            <div class="grid-2">
              <div class="card card-pad">
                <div class="card-head"><h2>Visitas por dia</h2><span>{{ chartSub }}</span></div>
                <div class="chart" onMouseLeave="{{ chartLeave }}">
                  <div class="chart-plot">
                    <div class="chart-grid" style="top:0;"></div>
                    <div class="chart-grid" style="top:50%;"></div>
                    <span class="chart-max">{{ chartMax }}</span>
                    <sc-for list="{{ bars }}" as="b">
                      <div class="bar-col {{ b.cls }}" onMouseEnter="{{ b.hover }}" onClick="{{ b.hover }}"><div class="bar {{ b.zero }}" style="height:{{ b.h }};"></div></div>
                    </sc-for>
                  </div>
                  <div class="chart-x"><span>{{ xFirst }}</span><span>{{ xMid }}</span><span>{{ xLast }}</span></div>
                  <sc-if value="{{ tip }}">
                    <div class="chart-tip" style="left:{{ tip.left }};"><b>{{ tip.date }}</b><br>{{ tip.v }} visitas · {{ tip.c }} cliques · {{ tip.o }} pedidos</div>
                  </sc-if>
                </div>
              </div>

              <div class="card card-pad">
                <div class="card-head"><h2>Vendas por categoria</h2><span>{{ periodLabel }}</span></div>
                <sc-if value="{{ hasCatSales }}">
                  <div class="hbars">
                    <sc-for list="{{ catSales }}" as="c">
                      <div class="hbar-row">
                        <div class="hbar-top"><span>{{ c.label }} <span style="color:var(--muted);font-size:12px;">· {{ c.n }}</span></span><b>{{ c.value }}</b></div>
                        <div class="hbar-track"><div class="hbar-fill" style="width:{{ c.w }};"></div></div>
                      </div>
                    </sc-for>
                  </div>
                </sc-if>
                <sc-if value="{{ noCatSales }}"><div class="empty">Nenhuma venda registrada nesse período.<br>Quando você marcar uma peça como <b>Vendida</b>, ela aparece aqui.</div></sc-if>
              </div>
            </div>

            <div class="card card-pad">
              <div class="card-head"><h2>Peças mais vistas</h2><span>Cliques no {{ periodLabelLower }}</span></div>
              <sc-if value="{{ hasTop }}">
                <div style="overflow-x:auto;">
                  <table class="table">
                    <thead><tr><th></th><th>Peça</th><th class="num">Cliques</th><th class="num">Na sacola</th><th class="num hide-sm">Pedidos</th><th class="hide-sm">Status</th></tr></thead>
                    <tbody>
                      <sc-for list="{{ top }}" as="t">
                        <tr>
                          <td class="rank">{{ t.rank }}</td>
                          <td><div class="cell-prod"><div class="thumb"><sc-if value="{{ t.cover }}"><img src="{{ t.cover }}" alt=""></sc-if><sc-if value="{{ t.noCover }}"><div class="thumb-empty"></div></sc-if></div><div style="min-width:0;"><b>{{ t.name }}</b><small>{{ t.price }}</small></div></div></td>
                          <td class="num"><b>{{ t.cliques }}</b></td>
                          <td class="num">{{ t.sacola }}</td>
                          <td class="num hide-sm">{{ t.pedidos }}</td>
                          <td class="hide-sm"><span class="pill"><span class="dot" style="background:{{ t.dot }};"></span>{{ t.status }}</span></td>
                        </tr>
                      </sc-for>
                    </tbody>
                  </table>
                </div>
              </sc-if>
              <sc-if value="{{ noTop }}"><div class="empty">{{ noTopText }}</div></sc-if>
            </div>

            <div class="grid-2">
              <div class="card card-pad">
                <div class="card-head"><h2>Precisam de atenção</h2><span>Disponíveis há mais de 30 dias e pouco vistas</span></div>
                <sc-if value="{{ hasAttn }}">
                  <div class="list">
                    <sc-for list="{{ attn }}" as="a">
                      <div class="list-row">
                        <div class="thumb"><sc-if value="{{ a.cover }}"><img src="{{ a.cover }}" alt=""></sc-if><sc-if value="{{ a.noCover }}"><div class="thumb-empty"></div></sc-if></div>
                        <div class="grow"><b>{{ a.name }}</b><small>{{ a.meta }}</small></div>
                        <button onClick="{{ a.edit }}" class="btn">Editar</button>
                      </div>
                    </sc-for>
                  </div>
                  <p style="margin:12px 0 0;font-size:13px;color:var(--muted);">Dica: trocar a foto de capa ou dar um descontinho costuma fazer a peça girar.</p>
                </sc-if>
                <sc-if value="{{ noAttn }}"><div class="empty">Tudo girando bem por aqui. ✦</div></sc-if>
              </div>

              <div class="card card-pad">
                <div class="card-head"><h2>Últimas vendas</h2><span>{{ soldAllLabel }}</span></div>
                <sc-if value="{{ hasRecent }}">
                  <div class="list">
                    <sc-for list="{{ recent }}" as="r">
                      <div class="list-row">
                        <div class="thumb"><sc-if value="{{ r.cover }}"><img src="{{ r.cover }}" alt=""></sc-if><sc-if value="{{ r.noCover }}"><div class="thumb-empty"></div></sc-if></div>
                        <div class="grow"><b>{{ r.name }}</b><small>{{ r.date }}</small></div>
                        <b style="font-feature-settings:'tnum';white-space:nowrap;">{{ r.value }}</b>
                      </div>
                    </sc-for>
                  </div>
                </sc-if>
                <sc-if value="{{ noRecent }}"><div class="empty">Nenhuma venda ainda. A primeira vem aí!</div></sc-if>
              </div>
            </div>
          </sc-if>

          <!-- ============ PEÇAS ============ -->
          <sc-if value="{{ tabPecas }}">
            <div class="page-head">
              <div>
                <span class="eyebrow">Closet</span>
                <h1>Suas peças</h1>
                <p>Tudo que você mudar aqui aparece na loja na hora.</p>
              </div>
              <button onClick="{{ newProduct }}" class="btn btn-primary" style="min-height:46px;padding:10px 22px;font-size:14px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>Nova peça</button>
            </div>

            <div class="toolbar">
              <div class="chips">
                <sc-for list="{{ filters }}" as="f">
                  <button onClick="{{ f.pick }}" class="chip {{ f.cls }}"><span class="dot" style="background:{{ f.dot }};display:{{ f.dotDisplay }};"></span>{{ f.label }} <span class="n">{{ f.n }}</span></button>
                </sc-for>
              </div>
              <div class="search">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
                <input class="input" value="{{ q }}" onChange="{{ onQ }}" placeholder="Buscar por nome, marca ou código">
              </div>
            </div>

            <div class="card" style="overflow:hidden;">
              <sc-for list="{{ rows }}" as="r">
                <div class="prow">
                  <div class="thumb" onClick="{{ r.edit }}"><sc-if value="{{ r.hasCover }}"><img src="{{ r.cover }}" alt=""></sc-if><sc-if value="{{ r.noCover }}"><div class="thumb-empty"></div></sc-if></div>
                  <div class="prow-info">
                    <b>{{ r.name }}</b>
                    <small>{{ r.meta }}</small>
                    <span class="price">{{ r.price }}</span>
                  </div>
                  <div class="prow-stats">
                    <sc-if value="{{ r.hasStats }}">
                      <span title="Cliques no período"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg>{{ r.cliques }}</span>
                      <span title="Colocada na sacola"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"></path><path d="M3 6h18"></path></svg>{{ r.sacola }}</span>
                    </sc-if>
                    <span>{{ r.age }}</span>
                  </div>
                  <div class="prow-ctrl">
                    <div class="status-sel">
                      <span class="dot" style="background:{{ r.dot }};"></span>
                      <select value="{{ r.status }}" onChange="{{ r.setStatus }}" class="input">
                        <sc-for list="{{ statusOpts }}" as="o"><option value="{{ o.v }}">{{ o.l }}</option></sc-for>
                      </select>
                    </div>
                    <button onClick="{{ r.edit }}" class="btn">Editar</button>
                    <button onClick="{{ r.remove }}" class="btn btn-danger">Excluir</button>
                  </div>
                </div>
              </sc-for>
              <sc-if value="{{ noRows }}"><div class="empty" style="padding:56px 16px;">{{ noRowsText }}</div></sc-if>
            </div>
          </sc-if>

          <!-- ============ CONFIGURAÇÕES ============ -->
          <sc-if value="{{ tabLoja }}">
            <div class="page-head">
              <div>
                <span class="eyebrow">Loja</span>
                <h1>Configurações</h1>
                <p>Textos, fotos, contato, categorias e tamanhos.</p>
              </div>
              <button onClick="{{ saveSettings }}" class="btn btn-primary" style="min-height:46px;padding:10px 22px;font-size:14px;">Salvar alterações</button>
            </div>

            <div class="card">
              <sc-for list="{{ groups }}" as="g">
                <section class="set-sec">
                  <div><h2>{{ g.title }}</h2><p>{{ g.desc }}</p></div>
                  <div class="set-fields">
                    <sc-for list="{{ g.fields }}" as="f">
                      <label class="field" style="grid-column:{{ f.col }};">
                        <span class="label">{{ f.label }}</span>
                        <sc-if value="{{ f.isText }}"><input class="input" type="{{ f.inputType }}" value="{{ f.value }}" placeholder="{{ f.ph }}" onChange="{{ f.on }}"></sc-if>
                        <sc-if value="{{ f.isArea }}"><textarea class="input" rows="4" value="{{ f.value }}" onChange="{{ f.on }}"></textarea></sc-if>
                        <sc-if value="{{ f.hasHint }}"><span style="font-size:12px;color:var(--muted);">{{ f.hint }}</span></sc-if>
                      </label>
                    </sc-for>
                    <sc-for list="{{ g.images }}" as="im">
                      <div class="field">
                        <span class="label">{{ im.label }}</span>
                        <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;">
                          <div class="photo-box">
                            <sc-if value="{{ im.has }}"><img src="{{ im.src }}" alt=""></sc-if>
                            <sc-if value="{{ im.none }}"><div class="thumb-empty"></div></sc-if>
                          </div>
                          <div style="display:flex;flex-direction:column;gap:6px;">
                            <label class="btn" style="cursor:pointer;">Escolher foto<input type="file" accept="image/*" onChange="{{ im.upload }}" style="display:none;"></label>
                            <sc-if value="{{ im.has }}"><button onClick="{{ im.clear }}" class="btn btn-danger">Remover</button></sc-if>
                          </div>
                        </div>
                      </div>
                    </sc-for>
                    <sc-for list="{{ g.lists }}" as="l">
                      <div class="field" style="grid-column:1 / -1;">
                        <span class="label">{{ l.label }}</span>
                        <div style="display:flex;gap:8px;flex-wrap:wrap;">
                          <sc-for list="{{ l.items }}" as="it">
                            <span class="tag">{{ it.v }}<button onClick="{{ it.remove }}" aria-label="Remover">×</button></span>
                          </sc-for>
                        </div>
                        <form onSubmit="{{ l.add }}" style="display:flex;gap:8px;max-width:380px;margin-top:4px;">
                          <input class="input" value="{{ l.input }}" onChange="{{ l.onInput }}" placeholder="{{ l.ph }}">
                          <button type="submit" class="btn" style="flex:none;min-height:44px;">Adicionar</button>
                        </form>
                      </div>
                    </sc-for>
                  </div>
                </section>
              </sc-for>
              <section class="set-sec">
                <div><h2>Backup</h2><p>Baixe uma cópia de todas as peças e configurações de vez em quando.</p></div>
                <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start;">
                  <button onClick="{{ exportData }}" class="btn">Baixar backup</button>
                  <label class="btn" style="cursor:pointer;">Restaurar backup<input type="file" accept="application/json,.json" onChange="{{ importData }}" style="display:none;"></label>
                </div>
              </section>
            </div>
          </sc-if>

          </div>
        </main>
      </div>
    </div>
  </sc-if>

  <!-- ===================== MODAL PEÇA ===================== -->
  <sc-if value="{{ hasDraft }}">
    <div class="overlay" onClick="{{ closeDraft }}">
      <div class="modal" onClick="{{ stop }}">
        <div class="modal-head">
          <div style="display:flex;flex-direction:column;">
            <span style="font-family:var(--font-heading);font-size:26px;line-height:1.1;">{{ draftTitle }}</span>
            <span style="font-size:12px;color:var(--muted);font-feature-settings:'tnum';">{{ draftCode }}</span>
          </div>
          <button onClick="{{ closeDraft }}" aria-label="Fechar" class="btn btn-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
          </button>
        </div>
        <div class="modal-body">
          <div style="display:flex;flex-direction:column;gap:10px;">
            <div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;">
              <span class="label">FOTOS</span>
              <span style="font-size:12px;color:var(--muted);">A primeira é a capa. Toque numa foto para torná-la capa.</span>
            </div>
            <div style="display:flex;gap:10px;flex-wrap:wrap;">
              <sc-for list="{{ draftImgs }}" as="im">
                <div class="photo" style="outline:2px solid {{ im.outline }};outline-offset:2px;">
                  <img src="{{ im.src }}" alt="" onClick="{{ im.cover }}">
                  <sc-if value="{{ im.isCover }}"><span class="cover">Capa</span></sc-if>
                  <button onClick="{{ im.remove }}" aria-label="Remover foto" class="rm">×</button>
                </div>
              </sc-for>
              <label class="photo-add">
                <span style="font-size:26px;line-height:1;">+</span>{{ uploadLabel }}
                <input type="file" accept="image/*" multiple="{{ true }}" onChange="{{ addImgs }}" style="display:none;">
              </label>
            </div>
          </div>
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:16px;">
            <sc-for list="{{ draftFields }}" as="f">
              <label class="field" style="grid-column:{{ f.col }};">
                <span class="label">{{ f.label }}</span>
                <sc-if value="{{ f.isText }}"><input class="input" type="{{ f.inputType }}" value="{{ f.value }}" placeholder="{{ f.ph }}" onChange="{{ f.on }}"></sc-if>
                <sc-if value="{{ f.isArea }}"><textarea class="input" rows="4" value="{{ f.value }}" placeholder="{{ f.ph }}" onChange="{{ f.on }}"></textarea></sc-if>
                <sc-if value="{{ f.isSelect }}">
                  <select class="input" value="{{ f.value }}" onChange="{{ f.on }}">
                    <sc-for list="{{ f.options }}" as="o"><option value="{{ o.v }}">{{ o.l }}</option></sc-for>
                  </select>
                </sc-if>
                <sc-if value="{{ f.hasHint }}"><span style="font-size:12px;color:var(--muted);">{{ f.hint }}</span></sc-if>
              </label>
            </sc-for>
          </div>
        </div>
        <div class="modal-foot">
          <span style="font-size:13px;color:#9A3B2A;font-weight:600;">{{ formErr }}</span>
          <div style="display:flex;gap:8px;margin-left:auto;">
            <button onClick="{{ closeDraft }}" class="btn" style="min-height:46px;">Cancelar</button>
            <button onClick="{{ saveDraft }}" class="btn btn-primary" style="min-height:46px;padding:10px 24px;font-size:14px;">Salvar peça</button>
          </div>
        </div>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ hasFlash }}"><div class="toast">{{ flash }}</div></sc-if>
</div>
</script>

<script type="module">
import { DCLogic, mount } from './dc-lite.js';

const LOGIN_MSGS = {
  rede: 'Não consegui conectar ao Supabase. Confira sua internet e o endereço em config.js.',
  confirmar: 'Esse e-mail ainda não foi confirmado no Supabase (Authentication › Users).',
  credenciais: 'E-mail ou senha incorretos. Tenta de novo?'
};
const svg = p => `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const ICONS = {
  dash: svg('<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/>'),
  pecas: svg('<path d="M12 4a2 2 0 1 1 2 2c-1 0-2 .7-2 2"/><path d="M12 8 2.5 15.2A1.5 1.5 0 0 0 3.4 18h17.2a1.5 1.5 0 0 0 .9-2.8L12 8Z"/>'),

          return;
        }
        if (st.pw === s.password) { sessionStorage.setItem('isa-admin-ok', '1'); m.markAdmin(); this.setState({ authed: true, pw: '' }); } else this.setState({ pwErr: 'Senha incorreta. Tenta de novo?' });
      },
      logout: () => { sessionStorage.removeItem('isa-admin-ok'); sessionStorage.removeItem('isa-admin-token'); this.setState({ authed: false, token: '', stats: null, statsState: 'idle' }); },
      nav, tabDash: st.tab === 'dash', tabPecas: st.tab === 'pecas', tabLoja: st.tab === 'loja',

      greeting: (h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite') + ', Isa ✦',
      periods: [7, 30, 90].map(n => ({ label: n + ' dias', cls: period === n ? 'on' : '', pick: () => { if (period !== n) { this.setState({ period: n, hover: -1 }); this.loadStats(n); } } })),
      periodLabel, periodLabelLower: periodLabel.toLowerCase().replace('últimos', 'últimos'),
      statsNotice, kpis, minis,
      bars, tip, chartLeave: () => this.setState({ hover: -1 }), chartMax: statsOk ? num(maxV) : '',
      chartSub: statsOk ? num(tot.v) + ' visitas no período' : (st.statsState === 'loading' ? 'carregando…' : 'sem dados ainda'),
      xFirst: ddmm(days[0].dt), xMid: ddmm(days[Math.floor(days.length / 2)].dt), xLast: 'hoje',
      catSales, hasCatSales: catSales.length > 0, noCatSales: catSales.length === 0,
      top, hasTop: top.length > 0, noTop: top.length === 0,
      noTopText: statsOk ? 'Ninguém clicou em peças nesse período ainda.' : 'Assim que as estatísticas estiverem ativas, o ranking aparece aqui.',
      attn, hasAttn: attn.length > 0, noAttn: attn.length === 0,
      recent, hasRecent: recent.length > 0, noRecent: recent.length === 0,
      soldAllLabel: sold.length === 1 ? '1 peça vendida no total' : sold.length + ' peças vendidas no total',

      filters, q: st.q, onQ: e => this.setState({ q: e.target.value }),
      rows, noRows: !!d && rows.length === 0, noRowsText: products.length ? 'Nenhuma peça encontrada com esse filtro.' : 'Seu closet está vazio. Clique em "Nova peça" para começar!',
      statusOpts: statuses.map(x => ({ v: x.v, l: x.l })),
      newProduct: () => this.setState({ formErr: '', draft: { id: m.uid(), code: m.nextCode(products), name: '', brand: '', category: (s.categories || [])[0] || '', size: (s.sizes || [])[0] || '', condition: 'Seminova', price: '', discount: '', soldPrice: '', measures: '', description: '', status: 'disponivel', images: [], createdAt: Date.now() } }),
      hasDraft: !!dr, draftTitle: dr && products.some(x => x.id === dr.id) ? 'Editar peça' : 'Nova peça', draftCode: dr ? 'Código ' + dr.code : '',
      draftFields, draftImgs, uploadLabel: st.uploading ? 'Enviando…' : 'Adicionar fotos',
      addImgs: async e => { const r = await this.readImgs(e.target.files); e.target.value = ''; this.setState(x => ({ draft: { ...x.draft, images: [...x.draft.images, ...r] } })); },
      saveDraft, closeDraft: () => this.setState({ draft: null }), stop: e => e.stopPropagation(), formErr: st.formErr,
      groups,
      saveSettings: () => { if (!m.remote && !sd.password) return this.toast('A senha não pode ficar vazia.'); this.commit({ ...d, settings: sd }, 'Salvo! Já está na loja.'); },
      exportData: () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(d)], { type: 'application/json' })); a.download = 'desapega-da-isa-backup.json'; a.click(); },
      importData: e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { try { const nd = JSON.parse(r.result); if (!nd.products || !nd.settings) throw 0; this.commit(nd, 'Backup restaurado.'); this.setState({ sd: nd.settings }); } catch (x) { this.toast('Arquivo de backup inválido.'); } }; r.readAsText(f); e.target.value = ''; },
      flash: st.flash, hasFlash: !!st.flash
    };
  }
}

mount(Component);
</script>
</body>
</html>
