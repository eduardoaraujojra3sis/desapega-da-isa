<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desapega da Isa</title>
<meta name="description" content="Desapega da Isa — peças únicas, revisadas pela Isa, com pedido direto no WhatsApp.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Mulish:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--radius-lg:7px}
html{scroll-behavior:smooth;scrollbar-gutter:stable}
@keyframes isaFade{from{opacity:0}to{opacity:1}}
@keyframes isaRise{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
@keyframes isaSlide{from{transform:translateX(100%)}to{transform:none}}
@keyframes isaPulse{0%,100%{opacity:.35;transform:scale(.9)}50%{opacity:1;transform:scale(1)}}
@keyframes isaToast{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
img{-webkit-user-drag:none}
body{margin:0;background:#F5EDE1;color:#2B1D14;font-family:'Mulish',sans-serif;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:#2B1D14;text-decoration:none}
a:hover{color:#8B4A2B}
button,select,input{font-family:inherit}
:focus-visible{outline:2px solid #8B4A2B;outline-offset:2px}
::selection{background:#E6C9A8}
</style>
</head>
<body>
<div id="app"></div>

<script type="text/x-dc-template" id="dc-template">
<div id="top" style="min-height:100vh;background:#F5EDE1;color:#2B1D14;font-family:'Mulish',sans-serif;">
  <sc-if value="{{ veilOn }}">
    <div style="position:fixed;inset:0;z-index:200;background:#F5EDE1;display:flex;align-items:center;justify-content:center;opacity:{{ veilOpacity }};transition:opacity .45s ease;pointer-events:{{ veilEvents }};">
      <span style="color:#8B4A2B;font-size:26px;animation:isaPulse 1.4s ease-in-out infinite;">★</span>
    </div>
  </sc-if>
  <div style="background:#2B1D14;color:#EADCC8;text-align:center;font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;padding:11px 16px;">✦ {{ s.announcement }} ✦</div>

  <header style="position:sticky;top:0;z-index:20;background:rgba(245,237,225,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid #D9C6AC;">
    <div style="max-width:1320px;margin:0 auto;padding:0 clamp(16px,4vw,48px);height:80px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;">
      <div>
        <nav style="display:{{ navDisplay }};gap:24px;white-space:nowrap;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;">
          <a href="#closet">O closet</a>
          <a href="#como">Como comprar</a>
          <a href="#sobre">A Isa</a>
        </nav>
      </div>
      <a href="#top" style="display:flex;flex-direction:column;align-items:center;line-height:1;gap:4px;">
        <span style="font-family:'Rye',serif;font-size:clamp(22px,3vw,32px);color:#2B1D14;white-space:nowrap;">{{ s.storeName }}</span>
        <span style="font-size:9px;letter-spacing:.42em;text-transform:uppercase;color:#8B4A2B;font-weight:700;">★ closet e moda country ★</span>
      </a>
      <div style="display:flex;justify-content:flex-end;">
        <button onClick="{{ openCart }}" style="display:inline-flex;align-items:center;gap:10px;padding:10px 16px;border-radius:999px;border:1px solid #2B1D14;background:transparent;color:#2B1D14;cursor:pointer;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;" style-hover="background:#2B1D14;color:#F5EDE1">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"></path><path d="M3 6h18"></path><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
          <span style="display:{{ bagLabelDisplay }};">Sacola</span>
          <sc-if value="{{ hasCount }}">
            <span style="min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:#8B4A2B;color:#FBF6EE;font-size:12px;display:inline-flex;align-items:center;justify-content:center;font-feature-settings:'tnum';letter-spacing:0;">{{ cartCount }}</span>
          </sc-if>
        </button>
      </div>
    </div>
  </header>

  <sc-if value="{{ isHome }}">
  <section style="max-width:1320px;margin:0 auto;padding:clamp(40px,7vw,96px) clamp(16px,4vw,48px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:clamp(40px,6vw,96px);align-items:center;">
    <div style="display:flex;flex-direction:column;gap:28px;">
      <span style="font-size:12px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:#8B4A2B;display:flex;align-items:center;gap:14px;"><span style="width:40px;height:0;border-top:1px dashed #8B4A2B;"></span>{{ s.heroEyebrow }}</span>
      <h1 style="font-family:'Playfair Display',serif;font-weight:400;font-size:clamp(46px,6.6vw,96px);line-height:.98;letter-spacing:-0.02em;margin:0;text-wrap:balance;">{{ s.heroTitle }}</h1>
      <p style="font-size:clamp(16px,1.4vw,18px);line-height:1.75;max-width:500px;margin:0;color:#5A4636;text-wrap:pretty;">{{ s.heroText }}</p>
      <div style="display:flex;gap:14px;flex-wrap:wrap;align-items:center;">
        <a href="#closet" style="background:#8B4A2B;color:#FBF6EE;padding:17px 32px;border-radius:999px;white-space:nowrap;font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;" style-hover="background:#6F3A20;color:#FBF6EE">Bora garimpar</a>
        <a href="#como" style="padding:16px 26px;border-radius:999px;white-space:nowrap;border:1px solid #2B1D14;font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;" style-hover="background:#2B1D14;color:#F5EDE1">Como funciona</a>
      </div>
    </div>
    <div style="position:relative;max-width:520px;width:100%;justify-self:center;padding:14px;border:1px solid #CDB79A;border-radius:999px 999px 10px 10px;">
      <div style="position:relative;aspect-ratio:4/5;border-radius:999px 999px 4px 4px;overflow:hidden;outline:1px dashed #B8875A;outline-offset:-10px;background:#EADCC8;">
        <sc-if value="{{ heroHasImg }}">
          <img src="{{ s.heroImage }}" alt="Isa" style="width:100%;height:100%;object-fit:cover;display:block;">
        </sc-if>
        <sc-if value="{{ heroNoImg }}">
          <div style="position:absolute;inset:0;background:repeating-linear-gradient(135deg,#EADCC8 0 12px,#E3D1B9 12px 24px);display:flex;align-items:center;justify-content:center;font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#6B5646;">foto da Isa · envie pelo painel</div>
        </sc-if>
      </div>
      <sc-if value="{{ hasAvail }}"><div style="position:absolute;left:-10px;bottom:44px;background:#2B1D14;color:#F5EDE1;padding:14px 20px;border-radius:6px;display:flex;flex-direction:column;gap:2px;box-shadow:0 10px 24px rgba(43,29,20,.18);">
        <span style="font-family:'Rye',serif;font-size:22px;line-height:1;color:#E6C9A8;">{{ heroBadge }}</span>
        <span style="font-size:10px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;">no closet agora</span>
      </div></sc-if>
    </div>
  </section>

  <div style="background:#8B4A2B;color:#FBF6EE;overflow:hidden;">
    <div style="max-width:1320px;margin:0 auto;padding:16px clamp(16px,4vw,48px);display:flex;justify-content:center;gap:14px 40px;flex-wrap:wrap;font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;">
      <span>★ Peças únicas</span>
      <span>★ Revisadas pela Isa</span>
      <span>★ Fechamento no WhatsApp</span>
    </div>
  </div>
  </sc-if>

  <section id="closet" style="scroll-margin-top:80px;">
    <div style="max-width:1680px;margin:0 auto;padding:clamp(48px,7vw,96px) clamp(8px,2.5vw,40px);display:flex;flex-direction:column;gap:36px;">
      <sc-if value="{{ isHome }}">
        <div style="display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;">
          <span style="font-size:12px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:#8B4A2B;">— ✦ O closet ✦ —</span>
          <h2 style="font-family:'Playfair Display',serif;font-weight:400;font-size:clamp(38px,4.6vw,60px);line-height:1.05;margin:0;">Escolhe a sua <em style="color:#8B4A2B;">favorita</em></h2>
        </div>
      </sc-if>
      <sc-if value="{{ isCat }}">
        <div style="display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;padding-top:clamp(0px,2vw,24px);animation:isaFade .4s ease both;">
          <div style="display:flex;align-items:center;gap:12px;font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#6B5646;">
            <a href="#" onClick="{{ goHome }}" style="color:#6B5646;" style-hover="color:#8B4A2B">Início</a>
            <span style="color:#B8875A;">✦</span>
            <span style="color:#8B4A2B;">{{ catTitle }}</span>
          </div>
          <h1 style="font-family:'Playfair Display',serif;font-weight:400;font-style:italic;font-size:clamp(52px,8vw,112px);line-height:.95;letter-spacing:-0.02em;margin:0;">{{ catTitle }}</h1>
          <span style="font-size:15px;color:#6B5646;">{{ catSub }}</span>
          <a href="#" onClick="{{ goHome }}" style="display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:999px;border:1px solid #2B1D14;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;" style-hover="background:#2B1D14;color:#F5EDE1"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="m15 18-6-6 6-6"></path></svg>Voltar ao início</a>
        </div>
      </sc-if>

      <div style="display:flex;flex-direction:column;gap:16px;border-top:1px dashed #CDB79A;border-bottom:1px dashed #CDB79A;padding:18px 0;">
        <div style="display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;justify-content:{{ chipJustify }};">
          <sc-for list="{{ cats }}" as="c">
            <button onClick="{{ c.pick }}" style="flex:none;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:10px 20px;border-radius:999px;white-space:nowrap;border:1px solid {{ c.border }};color:{{ c.color }};background:{{ c.bg }};cursor:pointer;">{{ c.label }}</button>
          </sc-for>
        </div>
        <div style="display:flex;gap:12px 24px;flex-wrap:wrap;align-items:center;justify-content:center;font-size:13px;color:#6B5646;">
          <label style="display:flex;align-items:center;gap:8px;">Tamanho
            <select value="{{ size }}" onChange="{{ onSize }}" style="appearance:none;-webkit-appearance:none;background:#FBF6EE;border:1px solid #D9C6AC;border-radius:999px;padding:8px 18px;font-size:13px;color:#2B1D14;cursor:pointer;">
              <sc-for list="{{ sizeOpts }}" as="o"><option value="{{ o }}">{{ o }}</option></sc-for>
            </select>
          </label>
          <label style="display:flex;align-items:center;gap:8px;">Ordenar
            <select value="{{ sort }}" onChange="{{ onSort }}" style="appearance:none;-webkit-appearance:none;background:#FBF6EE;border:1px solid #D9C6AC;border-radius:999px;padding:8px 18px;font-size:13px;color:#2B1D14;cursor:pointer;">
              <option value="recentes">Mais recentes</option>
              <option value="menor">Menor preço</option>
              <option value="maior">Maior preço</option>
            </select>
          </label>
          <span style="font-feature-settings:'tnum';font-weight:600;">{{ countLabel }}</span>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:{{ gridCols }};gap:clamp(24px,3vw,40px) clamp(6px,1vw,16px);">
        <sc-for list="{{ cards }}" as="c">
          <article onClick="{{ c.open }}" style="cursor:pointer;display:flex;flex-direction:column;gap:14px;opacity:{{ c.opacity }};transition:transform .3s ease;" style-hover="transform:translateY(-3px)">
            <div style="position:relative;aspect-ratio:2/3;overflow:hidden;background:#EADCC8;border-radius:4px;">
              <sc-if value="{{ c.hasCover }}">
                <img loading="lazy" decoding="async" src="{{ c.cover }}" alt="{{ c.name }}" style="width:100%;height:100%;object-fit:cover;display:block;">
              </sc-if>
              <sc-if value="{{ c.noCover }}">
                <div style="position:absolute;inset:0;background:repeating-linear-gradient(135deg,#EADCC8 0 12px,#E3D1B9 12px 24px);display:flex;align-items:center;justify-content:center;font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#6B5646;">foto da peça</div>
              </sc-if>
              <div style="position:absolute;inset:8px;border:1px dashed rgba(251,246,238,.7);border-radius:4px;pointer-events:none;"></div>
              <sc-if value="{{ c.hasBadge }}">
                <span style="position:absolute;top:16px;left:16px;background:{{ c.badgeColor }};color:#FBF6EE;font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;padding:6px 12px;border-radius:999px;">{{ c.badge }}</span>
              </sc-if>
              <sc-if value="{{ c.hasOff }}">
                <span style="position:absolute;top:16px;right:16px;background:#8B4A2B;color:#FBF6EE;font-size:11px;font-weight:700;letter-spacing:.06em;padding:6px 11px;border-radius:999px;font-feature-settings:'tnum';">{{ c.off }}</span>
              </sc-if>
            </div>
            <div style="display:flex;flex-direction:column;gap:5px;padding:0 2px;">
              <span style="font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#8B4A2B;">{{ c.brand }}</span>
              <span style="font-family:'Playfair Display',serif;font-size:clamp(17px,1.5vw,20px);line-height:1.25;">{{ c.name }}</span>
              <div style="display:flex;justify-content:space-between;align-items:baseline;gap:4px 10px;flex-wrap:wrap;margin-top:2px;">
                <span style="font-size:13px;color:#6B5646;">{{ c.meta }}</span>
                <span style="display:inline-flex;align-items:baseline;gap:8px;white-space:nowrap;"><sc-if value="{{ c.hasOff }}"><s style="font-size:13px;color:#8A7462;font-feature-settings:'tnum';">{{ c.oldPrice }}</s></sc-if><span style="font-family:'Playfair Display',serif;font-size:18px;font-weight:500;font-feature-settings:'tnum';color:{{ c.priceColor }};">{{ c.price }}</span></span>
              </div>
            </div>
          </article>
        </sc-for>
      </div>

      <sc-if value="{{ isEmpty }}">
        <div style="border:1px dashed #B8875A;border-radius:12px;padding:64px 24px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;background:#FBF6EE;">
          <span style="font-family:'Rye',serif;font-size:22px;color:#8B4A2B;">★</span>
          <span style="font-family:'Playfair Display',serif;font-size:clamp(26px,3vw,34px);font-style:italic;">{{ emptyTitle }}</span>
          <span style="font-size:15px;color:#6B5646;">{{ emptyText }}</span>
          <sc-if value="{{ hasFilter }}"><button onClick="{{ clearFilters }}" style="background:#8B4A2B;color:#FBF6EE;border:0;padding:14px 26px;border-radius:999px;white-space:nowrap;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;" style-hover="background:#6F3A20">Ver tudo</button></sc-if>
        </div>
      </sc-if>
    </div>
  </section>

  <sc-if value="{{ isHome }}">
  <section id="como" style="background:#2B1D14;color:#F5EDE1;scroll-margin-top:80px;">
    <div style="max-width:1320px;margin:0 auto;padding:clamp(56px,7vw,104px) clamp(16px,4vw,48px);display:flex;flex-direction:column;gap:48px;">
      <div style="display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;">
        <span style="font-size:12px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:#E6C9A8;">— ✦ Como comprar ✦ —</span>
        <h2 style="font-family:'Playfair Display',serif;font-weight:400;font-size:clamp(38px,4.6vw,60px);line-height:1.05;margin:0;">Simples assim, <em style="color:#E6C9A8;">ó</em></h2>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:20px;">
        <div style="border:1px dashed rgba(230,201,168,.45);border-radius:12px;padding:32px 28px;display:flex;flex-direction:column;gap:12px;">
          <span style="font-family:'Rye',serif;font-size:40px;color:#E6C9A8;line-height:1;">01</span>
          <span style="font-family:'Playfair Display',serif;font-size:26px;">Garimpa</span>
          <p style="margin:0;font-size:15px;line-height:1.7;color:#D9C6AC;">Dá aquela olhada no closet e joga na sacola tudo que fez seu coração bater mais forte.</p>
        </div>
        <div style="border:1px dashed rgba(230,201,168,.45);border-radius:12px;padding:32px 28px;display:flex;flex-direction:column;gap:12px;">
          <span style="font-family:'Rye',serif;font-size:40px;color:#E6C9A8;line-height:1;">02</span>
          <span style="font-family:'Playfair Display',serif;font-size:26px;">Manda pra Isa</span>
          <p style="margin:0;font-size:15px;line-height:1.7;color:#D9C6AC;">Clicou em finalizar, sua sacola vai prontinha pro WhatsApp da Isa. Sem cadastro, sem enrolação.</p>
        </div>
        <div style="border:1px dashed rgba(230,201,168,.45);border-radius:12px;padding:32px 28px;display:flex;flex-direction:column;gap:12px;">
          <span style="font-family:'Rye',serif;font-size:40px;color:#E6C9A8;line-height:1;">03</span>
          <span style="font-family:'Playfair Display',serif;font-size:26px;">Combina e recebe</span>
          <p style="margin:0;font-size:15px;line-height:1.7;color:#D9C6AC;">Pagamento e entrega a gente acerta juntinhas. Depois é só estrear e marcar a Isa!</p>
        </div>
      </div>
    </div>
  </section>

  <section id="sobre" style="scroll-margin-top:80px;">
    <div style="max-width:1200px;margin:0 auto;padding:clamp(56px,7vw,112px) clamp(16px,4vw,48px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:clamp(36px,6vw,96px);align-items:center;">
      <div style="max-width:420px;width:100%;justify-self:center;padding:12px;border:1px solid #CDB79A;border-radius:999px 999px 10px 10px;">
        <div style="position:relative;aspect-ratio:4/5;border-radius:999px 999px 4px 4px;overflow:hidden;background:#EADCC8;">
          <sc-if value="{{ aboutHasImg }}">
            <img src="{{ s.aboutImage }}" alt="Isa" style="width:100%;height:100%;object-fit:cover;display:block;">
          </sc-if>
          <sc-if value="{{ aboutNoImg }}">
            <div style="position:absolute;inset:0;background:repeating-linear-gradient(135deg,#EADCC8 0 12px,#E3D1B9 12px 24px);display:flex;align-items:center;justify-content:center;font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#6B5646;">retrato da Isa</div>
          </sc-if>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:22px;max-width:540px;">
        <span style="font-size:12px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:#8B4A2B;">— ✦ A Isa</span>
        <h2 style="font-family:'Playfair Display',serif;font-weight:400;font-style:italic;font-size:clamp(42px,5vw,72px);line-height:1;margin:0;">{{ s.aboutTitle }}</h2>
        <p style="margin:0;font-size:17px;line-height:1.8;color:#5A4636;text-wrap:pretty;">{{ s.aboutText }}</p>
        <a href="{{ igUrl }}" target="_blank" rel="noopener" style="align-self:flex-start;display:inline-block;white-space:nowrap;padding:14px 24px;border-radius:999px;border:1px solid #2B1D14;font-size:13px;font-weight:700;letter-spacing:.12em;" style-hover="background:#2B1D14;color:#F5EDE1">Segue lá: {{ s.instagram }}</a>
      </div>
    </div>
  </section>

  </sc-if>

  <footer style="background:#2B1D14;color:#D9C6AC;">
    <div style="max-width:1320px;margin:0 auto;padding:48px clamp(16px,4vw,48px) 40px;display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center;">
      <span style="font-family:'Rye',serif;font-size:clamp(26px,3.4vw,38px);color:#F5EDE1;">{{ s.storeName }}</span>
      <span style="font-size:11px;letter-spacing:.42em;text-transform:uppercase;color:#E6C9A8;font-weight:700;">★ ★ ★</span>
      <div style="display:flex;gap:28px;flex-wrap:wrap;justify-content:center;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;">
        <a href="{{ igUrl }}" target="_blank" rel="noopener" style="color:#F5EDE1;" style-hover="color:#E6C9A8">Instagram</a>
        <a href="{{ waUrl }}" target="_blank" rel="noopener" style="color:#F5EDE1;" style-hover="color:#E6C9A8">WhatsApp</a>
        <a href="painel.html" style="color:#A8927A;" style-hover="color:#E6C9A8">Área da Isa</a>
      </div>
    </div>
  </footer>

  <sc-if value="{{ hasOpen }}">
    <div onClick="{{ closeProduct }}" style="animation:isaFade .25s ease both;position:fixed;inset:0;z-index:50;background:rgba(43,29,20,.55);display:flex;align-items:center;justify-content:center;padding:{{ modalPad }};">
      <div onClick="{{ stop }}" style="animation:isaRise .35s cubic-bezier(.2,.8,.2,1) both;background:#F5EDE1;width:100%;max-width:1080px;height:{{ modalH }};max-height:100%;overflow:auto;position:relative;box-shadow:0 24px 60px rgba(43,29,20,.3);border-radius:{{ modalRadius }};">

<script type="module">
import { DCLogic, mount } from './dc-lite.js';

class Component extends DCLogic {
  state = { data: null, cart: [], cat: 'Todas', size: 'Todos', sort: 'recentes', openId: null, img: 0, cartOpen: false, name: '', w: window.innerWidth, toast: '', veil: 'on' };
  async componentDidMount() {
    this.m = await import(new URL('data.js', document.baseURI).href);
    const apply = data => {
      const ok = new Set(data.products.filter(p => p.status === 'disponivel').map(p => p.id));
      const cart = this.m.loadCart().filter(id => ok.has(id));
      this.m.saveCart(cart);
      this.setState({ data, cart });
    };
    this.reload = () => {
      if (!this.state.data) { const c = this.m.remote ? this.m.cached() : this.m.load(); if (c) apply(c); }
      if (this.m.remote) this.m.fetchRemote().then(d => apply(d || this.state.data || this.m.load())).catch(() => { if (!this.state.data) apply(this.m.load()); });
      else apply(this.m.load());
    };
    this.reload();
    try { if (!sessionStorage.getItem('isa-visit')) { sessionStorage.setItem('isa-visit', '1'); this.m.track([{ tipo: 'visita' }]); } } catch (e) {}
    const fontsReady = document.fonts ? document.fonts.ready.catch(() => {}) : Promise.resolve();
    const dataReady = new Promise(res => { const t = setInterval(() => { if (this.state.data) { clearInterval(t); res(); } }, 30); });
    const imgReady = dataReady.then(() => new Promise(res => { const src = this.state.data.settings.heroImage; if (!src) return res(); const i = new Image(); i.onload = i.onerror = res; i.src = src; }));
    const reveal = () => { if (this.state.veil !== 'on') return; this.setState({ veil: 'fading' }); setTimeout(() => this.setState({ veil: 'off' }), 480); };
    Promise.all([fontsReady, dataReady, imgReady]).then(() => requestAnimationFrame(reveal));
    setTimeout(reveal, 4000);
    this.onResize = () => this.setState({ w: window.innerWidth });
    window.addEventListener('storage', this.reload);
    window.addEventListener('focus', this.reload);
    window.addEventListener('resize', this.onResize);
    this.onKey = e => { if (e.key === 'Escape') this.setState({ openId: null, cartOpen: false }); };
    window.addEventListener('keydown', this.onKey);
    this.onHash = () => {
      const h = decodeURIComponent(location.hash.slice(1));
      const cat = h.startsWith('categoria/') ? h.slice(10) : 'Todas';
      if (cat !== this.state.cat) { this.setState({ cat, size: 'Todos' }); if (cat !== 'Todas') window.scrollTo({ top: 0, behavior: 'instant' }); }
    };
    this.onHash();
    window.addEventListener('hashchange', this.onHash);
  }
  goCat(c) { location.hash = 'categoria/' + encodeURIComponent(c); }
  goHome() { if (location.hash.startsWith('#categoria/')) { history.pushState(null, '', location.pathname + location.search); this.setState({ cat: 'Todas', size: 'Todos' }); window.scrollTo({ top: 0, behavior: 'instant' }); } }
  componentWillUnmount() {
    window.removeEventListener('storage', this.reload);
    window.removeEventListener('focus', this.reload);
    window.removeEventListener('resize', this.onResize);
    window.removeEventListener('keydown', this.onKey);
    window.removeEventListener('hashchange', this.onHash);
  }
  componentDidUpdate() { document.body.style.overflow = (this.state.openId || this.state.cartOpen) ? 'hidden' : ''; }
  setCart(cart) { this.setState({ cart }); this.m && this.m.saveCart(cart); }
  flash(t) { this.setState({ toast: t }); clearTimeout(this.tt); this.tt = setTimeout(() => this.setState({ toast: '' }), 2400); }
  renderVals() {
    const st = this.state, d = st.data, m = this.m;
    const s = d ? d.settings : {};
    const products = d ? d.products : [];
    const brl = n => m ? m.brl(n) : '';
    const mobile = st.w < 760;
    const pub = products.filter(p => p.status !== 'oculto');
    const statusInfo = p => p.status === 'vendido' ? ['Vendida', '#2B1D14'] : p.status === 'reservado' ? ['Reservada', '#8B4A2B'] : null;
    const cover = p => (p.images && p.images[0]) || '';
    const fp = p => m ? m.finalPrice(p) : Number(p.price || 0);
    const dc = p => m ? m.discountOf(p) : 0;
    const offLabel = p => '-' + String(dc(p)).replace('.', ',') + '%';
    const cats = ['Todas', ...(s.categories || [])].map(c => {
      const on = c === st.cat;
      return { label: c, bg: on ? '#2B1D14' : 'transparent', color: on ? '#F5EDE1' : '#2B1D14', border: on ? '#2B1D14' : '#CDB79A', pick: () => { if (c === 'Todas') this.goHome(); else this.goCat(c); } };
    });
    const rank = p => p.status === 'vendido' ? 2 : p.status === 'reservado' ? 1 : 0;
    const list = pub.filter(p => (st.cat === 'Todas' || p.category === st.cat) && (st.size === 'Todos' || p.size === st.size))
      .sort((a, b) => rank(a) - rank(b) || (st.sort === 'menor' ? fp(a) - fp(b) : st.sort === 'maior' ? fp(b) - fp(a) : (b.createdAt || 0) - (a.createdAt || 0)));
    const cards = list.map(p => {
      const si = statusInfo(p);
      return {
        name: p.name, brand: p.brand, meta: ['Tam. ' + p.size, p.condition].filter(Boolean).join(' · '),
        price: brl(fp(p)), oldPrice: brl(p.price), hasOff: dc(p) > 0, off: offLabel(p), priceColor: dc(p) ? '#8B4A2B' : '#2B1D14', cover: cover(p), hasCover: !!cover(p), noCover: !cover(p),
        hasBadge: !!si, badge: si ? si[0] : '', badgeColor: si ? si[1] : '', opacity: p.status === 'vendido' ? 0.55 : 1,
        open: () => { this.setState({ openId: p.id, img: 0 }); m && m.track([{ tipo: 'clique', produto: p.id }]); }
      };
    });
    const avail = pub.filter(p => p.status === 'disponivel').length;
    const op = products.find(x => x.id === st.openId);
    const imgs = op ? (op.images || []) : [];
    const idx = imgs.length ? Math.min(st.img, imgs.length - 1) : 0;
    const inCart = op && st.cart.includes(op.id);
    let btnLabel = 'Quero essa!', btnAction = () => { m.track([{ tipo: 'sacola', produto: op.id }]); this.setCart([...st.cart, op.id]); this.setState({ openId: null }); this.flash('Foi pra sacola!'); }, btnDisabled = false;
    if (op && op.status === 'vendido') { btnLabel = 'Já foi vendida'; btnDisabled = true; }
    else if (op && op.status === 'reservado') { btnLabel = 'Reservada no momento'; btnDisabled = true; }
    else if (inCart) { btnLabel = 'Já tá na sacola — ver sacola'; btnAction = () => this.setState({ openId: null, cartOpen: true }); }
    const osi = op ? statusInfo(op) : null;
    const items = st.cart.map(id => products.find(p => p.id === id)).filter(Boolean);
    const total = items.reduce((a, p) => a + fp(p), 0);
    const ig = (s.instagram || '').replace('@', '').trim();
    const checkout = () => {
      const photo = p => { const u = m.sitePhoto(cover(p)); return u ? `\n   Foto: ${u}` : ''; };
      const lines = items.map((p, i) => `${i + 1}. *${p.name}*${p.brand ? ' (' + p.brand + ')' : ''} · Tam. ${p.size} · ${brl(fp(p))}${dc(p) ? ' (de ' + brl(p.price) + ', ' + offLabel(p) + ')' : ''} · cód. ${p.code}${photo(p)}`);
      const txt = `${s.messageIntro}\n\n${lines.join('\n')}\n\nTotal: ${brl(total)}${st.name.trim() ? '\n\nMeu nome: ' + st.name.trim() : ''}`;
      m.track([{ tipo: 'pedido' }, ...items.map(p => ({ tipo: 'pedido_item', produto: p.id }))]);
      window.open(m.waLink(s.whatsapp, txt), '_blank');
    };
    return {
      veilOn: st.veil !== 'off', veilOpacity: st.veil === 'on' ? 1 : 0, veilEvents: st.veil === 'on' ? 'auto' : 'none',
      s, navDisplay: st.w < 1000 ? 'none' : 'flex', hasAvail: avail > 0, bagLabelDisplay: mobile ? 'none' : 'inline',
      cartCount: st.cart.length, hasCount: st.cart.length > 0,
      openCart: () => this.setState({ cartOpen: true }), closeCart: () => this.setState({ cartOpen: false }),
      heroHasImg: !!s.heroImage, heroNoImg: !s.heroImage,
      heroBadge: avail === 1 ? '1 peça' : avail + ' peças',
      aboutHasImg: !!s.aboutImage, aboutNoImg: !s.aboutImage,
      cats, sizeOpts: ['Todos', ...(s.sizes || [])], size: st.size, sort: st.sort,
      onSize: e => this.setState({ size: e.target.value }), onSort: e => this.setState({ sort: e.target.value }),
      countLabel: list.length === 1 ? '1 peça' : list.length + ' peças',
      isHome: st.cat === 'Todas', isCat: st.cat !== 'Todas', catTitle: st.cat,
      catSub: list.length === 1 ? '1 peça no closet' : list.length + ' peças no closet',
      goHome: e => { e && e.preventDefault(); this.goHome(); },
      cards, isEmpty: !!d && list.length === 0,
      hasFilter: pub.length > 0,
      emptyTitle: pub.length ? 'Ops, nada por aqui nesse filtro.' : 'Peças novas chegando em breve.',
      emptyText: pub.length ? 'Tenta outro tamanho ou categoria.' : 'O closet está sendo preparado. Volta logo!', clearFilters: () => this.setState({ cat: 'Todas', size: 'Todos' }),
      gridCols: st.w < 900 ? 'repeat(2,minmax(0,1fr))' : st.w < 1280 ? 'repeat(3,minmax(0,1fr))' : 'repeat(4,minmax(0,1fr))',
      hasOpen: !!op, closeProduct: () => this.setState({ openId: null }), stop: e => e.stopPropagation(),
      modalPad: mobile ? '0' : '32px', modalH: mobile ? '100%' : 'auto', modalRadius: mobile ? '0' : 'var(--radius-lg)', closePos: mobile ? 'fixed' : 'absolute',
      p: op ? { name: op.name, brand: op.brand, priceStr: brl(fp(op)), oldPrice: brl(op.price), hasOff: dc(op) > 0, off: offLabel(op), priceColor: dc(op) ? '#8B4A2B' : '#2B1D14', description: op.description, hasStatus: !!osi, statusLabel: osi ? osi[0] : '', statusColor: osi ? osi[1] : '' } : {},
      mainImg: imgs[idx] || '', hasMain: !!imgs[idx], noMain: !imgs[idx],
      hasThumbs: imgs.length > 1, imgCounter: (idx + 1) + ' / ' + imgs.length,
      thumbs: imgs.map((src, i) => ({ src, border: i === idx ? '#8B4A2B' : 'transparent', opacity: i === idx ? 1 : 0.7, pick: () => this.setState({ img: i }) })),
      prevImg: e => { e.stopPropagation(); this.setState({ img: (idx - 1 + imgs.length) % imgs.length }); },
      nextImg: e => { e.stopPropagation(); this.setState({ img: (idx + 1) % imgs.length }); },
      details: op ? [['Marca', op.brand], ['Tamanho', op.size], ['Estado', op.condition], ['Medidas', op.measures], ['Código', op.code]].filter(r => r[1]).map(r => ({ k: r[0], v: r[1] })) : [],
      btnLabel, btnAction, btnDisabled, btnBg: btnDisabled ? '#A8927A' : '#8B4A2B', btnCursor: btnDisabled ? 'not-allowed' : 'pointer', chipJustify: mobile ? 'flex-start' : 'center',
      cartOpen: st.cartOpen, cartEmpty: items.length === 0, cartHas: items.length > 0,
      cartCountLabel: items.length === 1 ? '1 peça' : items.length + ' peças',
      cartItems: items.map(p => ({ name: p.name, brand: p.brand, meta: 'Tam. ' + p.size + ' · ' + p.code, price: brl(fp(p)), oldPrice: brl(p.price), hasOff: dc(p) > 0, cover: cover(p), hasCover: !!cover(p), noCover: !cover(p), remove: () => this.setCart(st.cart.filter(x => x !== p.id)) })),
      totalStr: brl(total), name: st.name, onName: e => this.setState({ name: e.target.value }), checkout,
      toast: st.toast, hasToast: !!st.toast,
      igUrl: 'https://instagram.com/' + ig, waUrl: m ? m.waLink(s.whatsapp, 'Oi, Isa! Vim pelo Desapega.') : '#'
    };
  }
}

mount(Component);
</script>
